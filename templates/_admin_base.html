<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#17212b;--mute:#5d6b79;--line:#d5dbe1;--blue:#1f5fbf;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--panel:#18212b;--ink:#e8edf2;--mute:#97a5b3;--line:#2b3744;--blue:#6fa3f0;--bad:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;margin:18px 0}
.mute{color:var(--mute)}.err{color:var(--bad);font-weight:600}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}dt{color:var(--mute)}dd{margin:0}
input{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
a{color:var(--blue)}
</style>
</head>
<body>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
