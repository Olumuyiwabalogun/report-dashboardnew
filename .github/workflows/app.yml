name: app

on:
  pull_request:
    paths-ignore: ["infra/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["infra/**", "**.md"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: flake8 --max-line-length 100 .
      - run: pytest -q
      - name: Package Lambda zip (built once, deployed to every environment)
        run: |
          pip install -r requirements.txt -t build
          cp app.py attendance.py auth.py data.py lambda_handler.py register.py build/
          cp -r templates build/
          cd build && zip -qr ../package.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: package.zip

  deploy-dev:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    env:
      NAME: report-dashboard-dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Update both functions
        run: |
          for fn in web; do
            aws lambda update-function-code --function-name "$NAME-$fn" --zip-file fileb://package.zip > /dev/null
            aws lambda wait function-updated --function-name "$NAME-$fn"
          done
      - name: Smoke test
        run: curl -fsS "${{ vars.API_URL }}/health"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod # required reviewers = approval gate
    env:
      NAME: report-dashboard-prod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Update both functions
        run: |
          for fn in web; do
            aws lambda update-function-code --function-name "$NAME-$fn" --zip-file fileb://package.zip > /dev/null
            aws lambda wait function-updated --function-name "$NAME-$fn"
          done
      - name: Smoke test
        run: curl -fsS "${{ vars.API_URL }}/health"
