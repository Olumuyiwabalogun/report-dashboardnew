name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  id-token: write # lets the job request an OIDC token for AWS
  contents: read

defaults:
  run:
    working-directory: infra

jobs:
  plan-dev:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend-config=envs/dev.backend.hcl
      - run: terraform validate
      - run: terraform plan -var-file=envs/dev.tfvars

  apply-dev:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -backend-config=envs/dev.backend.hcl
      - run: terraform plan -var-file=envs/dev.tfvars -out=tfplan
      - run: terraform apply tfplan

  apply-prod:
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod # add required reviewers on this environment = approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -backend-config=envs/prod.backend.hcl
      - run: terraform plan -var-file=envs/prod.tfvars -out=tfplan
      - run: terraform apply tfplan
